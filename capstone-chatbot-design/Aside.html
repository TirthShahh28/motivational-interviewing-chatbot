<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Aside — a place to be heard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:        #F4EEE2;   /* warm cream */
      --surface:   #FBF7EE;   /* slightly lighter, for cards */
      --ink:       #2A2622;   /* deep warm ink */
      --ink-soft:  #5C544C;
      --ink-mute:  #8A8278;
      --rule:      #E4DCCC;
      --sage:      #7A8B6F;
      --sage-soft: #DCE3D2;   /* user bubble fill */
      --sage-deep: #5C6E54;
      --terra:     #B86F52;   /* ONLY for crisis */
      --terra-soft:#F1DDD2;
      --terra-bg:  #F7E8DD;

      --serif: "Newsreader", "Iowan Old Style", Georgia, serif;
      --sans:  "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --mono:  "JetBrains Mono", ui-monospace, Menlo, monospace;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
      height: 100%;
    }
    body { font-size: 17px; line-height: 1.55; }

    button { font-family: inherit; color: inherit; }

    /* hide scrollbars but allow scroll */
    .scroll-area { scrollbar-width: thin; scrollbar-color: var(--rule) transparent; }
    .scroll-area::-webkit-scrollbar { width: 6px; }
    .scroll-area::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 3px; }
    .scroll-area::-webkit-scrollbar-track { background: transparent; }

    @keyframes thinking-bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.35; }
      40%           { transform: translateY(-3px); opacity: 0.9; }
    }
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes toast-in {
      from { opacity: 0; transform: translate(-50%, -8px); }
      to   { opacity: 1; transform: translate(-50%, 0); }
    }
    @keyframes overlay-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes sheet-in {
      from { opacity: 0; transform: translateY(12px) scale(0.99); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes drawer-in {
      from { transform: translateX(100%); }
      to   { transform: translateX(0); }
    }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="src/icons.jsx"></script>
  <script type="text/babel" src="src/mock-backend.jsx"></script>
  <script type="text/babel" src="src/chat-pieces.jsx"></script>
  <script type="text/babel" src="src/modals.jsx"></script>
  <script type="text/babel" src="src/app.jsx"></script>
</body>
</html>
